name: Python Quality

# Not path-filtered on purpose: `python-quality` is a required check in the
# protect-main ruleset (infrastructure, repositories/ultimatelemon), and a
# required check from a path-filtered workflow blocks every pull request that
# skips the path.
on:
  pull_request:
  workflow_call:
    inputs:
      working-directory:
        type: string
        default: mcps/broker

permissions:
  contents: read

concurrency:
  group: python-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# shared-actions has no Python workflow (node-quality covers the npm
# workspaces only), so the broker server, the one Python server, runs its
# checks here. A public repository: GitHub-hosted runners.
jobs:
  quality:
    name: python-quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory || 'mcps/broker' }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.32'
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run pytest

name: Postbus Deployment

on:
  push:
    branches: [main]
    paths:
      - 'mcps/postbus/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.base.json'
      - '.github/workflows/postbus-deployment.yml'
      - '.github/workflows/code-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: postbus-deployment
  cancel-in-progress: true

# A public repository: GitHub-hosted runners, as the cluster runners admit
# private repositories only.
jobs:
  quality:
    uses: ./.github/workflows/code-quality.yml
    permissions:
      contents: read

  publish:
    needs: [quality]
    uses: ultimatelemon/shared-actions/.github/workflows/docker-publish.yml@v2
    permissions:
      contents: read
      packages: write
    with:
      runs-on: ubuntu-latest
      container-image: ''
      buildkit-endpoint: ''
      image: ghcr.io/${{ github.repository_owner }}/mcp-postbus
      dockerfile: mcps/postbus/Dockerfile

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [publish]
    uses: ultimatelemon/shared-actions/.github/workflows/dokploy-deploy.yml@v2
    with:
      runs-on: ubuntu-latest
      container-image: ''
      environment: postbus
      url: https://mcp.ultimatelemon.eu/postbus
    secrets:
      # A repository secret, not an environment secret: the calling job has no
      # environment, so an environment secret would resolve to an empty string.
      webhook-url: ${{ secrets.DOKPLOY_DEPLOY_URL_POSTBUS }}

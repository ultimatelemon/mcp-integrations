[project]
name = "broker"
version = "1.0.0"
description = "Read-only MCP server for an Interactive Brokers account through IB Gateway"
license = "MIT"
requires-python = ">=3.13,<3.14"
dependencies = [
  "ib_async>=2.1.0",
  "mcp>=2.3.0",
  "tzdata>=2025.3",
  "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
  "pyright>=1.1.414",
  "pytest>=9.2.0",
  "httpx>=0.28.1",
  "pytest-asyncio>=1.5.0",
  "ruff>=0.17.5",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[project.scripts]
broker = "broker.__main__:main"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "SIM", "PT"]
ignore = ["RUF001", "RUF002", "RUF003", "ASYNC109"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
